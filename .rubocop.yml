AllCops:
  TargetRubyVersion: 2.7
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "spec/integration/**/*"

Style/Documentation:
  Enabled: false

# `has_next` / `has_next?` mirrors the pagination contract (contracts/bml-remote.md,
# data-model.md); keep the domain term rather than renaming to `next?`.
Naming/PredicatePrefix:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# The configured Client exposes each capability (env, credentials, timeout,
# retry policy, audit sink) as an explicit keyword with a default; keyword
# configuration args read clearer than a bundled options object here.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 30

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Layout/LineLength:
  Max: 120
